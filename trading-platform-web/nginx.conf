server {
    listen 80;

    # forward api calls to the api container by its compose service name
    # trailing slashes matter: /api/stocks -> http://api:8080/api/stocks
    location /api/ {
        proxy_pass http://api:8080/api/;
    }

    # everything else is the angular single-page app
    # try the file, then the dir, then fall back to index.html so client-side
    # routes (like /dashboard) dont 404 on refresh
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
